{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Blog - Tao Souvenir stories and culture.">
    <title>Journals - Tao Souvenir</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{% static 'tao_souvenir/style.css' %}">
    <link rel="stylesheet" href="{% static 'tao_souvenir/blog.css' %}">
</head>

<body>
    <header id="main-header">
        <div class="header-container">
            <!-- Left Group (Scrolled Only) -->
            <div class="header-left-group">
                <a href="{% url 'pfl_app:tao_souvenir_home' %}">
                    <img src="{% static 'tao_souvenir/assets/left_most_header_light_logo.svg' %}" alt="Tao Logo"
                        class="left-most-logo">
                </a>
            </div>

            <!-- Center Group -->
            <img src="{% static 'tao_souvenir/assets/header_doorknob_dark.svg' %}" alt=""
                class="header-doorknob left-knob">
            <div class="header-center">
                <a href="{% url 'pfl_app:tao_souvenir_home' %}">
                    <img src="{% static 'tao_souvenir/assets/header_center_dark.svg' %}" alt="Tao Souvenir Logo"
                        class="header-logo" id="header-logo-img">
                </a>
            </div>
            <img src="{% static 'tao_souvenir/assets/header_doorknob_dark.svg' %}" alt=""
                class="header-doorknob right-knob">

            <!-- Right Group (Scrolled Only) -->
            <div class="header-right-group">
                <a href="https://www.instagram.com/tao.thesouvenir/"><img src="{% static 'tao_souvenir/assets/instagram_header_light_right_button.png' %}"
                        alt="Instagram" class="social-icon"></a>
                <a href="https://www.facebook.com/profile.php?id=61586932133580"><img
                        src="{% static 'tao_souvenir/assets/facebook_header_light_right_button.svg' %}" alt="Facebook"
                        class="social-icon"></a>
                <a href="https://www.tiktok.com/@tao.thesouvenir?lang=en"><img src="{% static 'tao_souvenir/assets/tiktok_header_light_right_button.svg' %}"
                        alt="TikTok" class="social-icon"></a>
            </div>
        </div>
    </header>

    <main>
        <!-- Navigation Stripe Background -->
        <div class="blog-nav-stripe"></div>

        <!-- Sticky Navigation Buttons -->
        <div class="overlay-buttons sticky">
            <a href="{% url 'pfl_app:about_us' %}" class="overlay-btn btn-red">About Us</a>
            <a href="{% url 'pfl_app:blog_list_page' %}" class="overlay-btn btn-blue">Journals</a>
            <a href="{% url 'pfl_app:products' %}" class="overlay-btn btn-yellow">Products</a>
            <a href="{% url 'pfl_app:campaigns_page' %}" class="overlay-btn btn-purple">Design for Society</a>
        </div>

        <!-- Blog Posts Grid -->
        <section class="blog-grid-section">
            <div class="blog-container">
                {% for journal in journals %}
                <a href="{% url 'pfl_app:blog_detail' journal.id %}" class="blog-preview-card" data-frame="{% cycle 'red' 'yellow' 'blue' %}">
                    <div class="blog-card-inner">
                        <div class="blog-image-area">
                            <img src="{% static 'tao_souvenir/assets/journals/' %}{{ journal.cover }}"
                                alt="{{ journal.title }}" class="blog-img">
                        </div>
                        <div class="blog-content">
                            <div class="blog-tags">
                                {% for tag in journal.tags %}
                                <span class="blog-tag-chip">{{ tag }}</span>
                                {% endfor %}
                            </div>
                            <div class="blog-divider"></div>
                            <h2 class="blog-title">{{ journal.title }}</h2>
                            <div class="blog-divider"></div>
                            <p class="blog-summary">{{ journal.summary }}</p>
                        </div>
                    </div>
                </a>
                {% endfor %}
            </div>
        </section>

        <!-- Footer -->
        <footer id="main-footer">
            <div class="footer-container">
                <!-- Left: Logo -->
                <div class="footer-left">
                    <img src="{% static 'tao_souvenir/assets/footer_logo_left.png' %}" alt="Tao Logo"
                        class="footer-logo">
                </div>

                <!-- Center: Contact Information -->
                <div class="footer-center">
                    <img src="{% static 'tao_souvenir/assets/contact_title.png' %}" alt="Contact" class="contact-title">
                    <div class="contact-list">
                        <a href="mailto:tao.thesouvenir@gmail.com" class="contact-item">
                            <img src="{% static 'tao_souvenir/assets/email_icon.png' %}" alt="Email"
                                class="contact-icon">
                            <span>tao.thesouvenir@gmail.com</span>
                        </a>
                        <a href="https://www.facebook.com/profile.php?id=61586932133580" class="contact-item">
                            <img src="{% static 'tao_souvenir/assets/facebook_icon.png' %}" alt="Facebook"
                                class="contact-icon">
                            <span>TẠO</span>
                        </a>
                        <a href="https://www.tiktok.com/@tao.thesouvenir?lang=en" class="contact-item">
                            <img src="{% static 'tao_souvenir/assets/tiktok_icon.png' %}" alt="TikTok"
                                class="contact-icon">
                            <span>tao.thesouvenir</span>
                        </a>
                        <a href="tel:+84373018990" class="contact-item">
                            <img src="{% static 'tao_souvenir/assets/phone_icon.png' %}" alt="Phone"
                                class="contact-icon">
                            <span>+84 373 018 990</span>
                        </a>
                    </div>
                </div>

                <!-- Right: Animated Logo -->
                <div class="footer-right">
                    <img src="{% static 'tao_souvenir/assets/header_center_light_1.svg' %}" alt="Tao"
                        class="footer-animated-logo" id="footer-animated-logo">
                </div>
            </div>
        </footer>
    </main>

    <script src="{% static 'tao_souvenir/script.js' %}"></script>
</body>

</html>
